<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="currency-converter-extension/shared/converter.css">
</head>
<body class="layout-centered">
    <div class="container">
        <div class="main">
            <div class="from-group">
                <input id="from-amount" class="amount-input" type="text" inputmode="decimal" value="1">
                <select id="from-curr">
                    <option selected>CZK</option>
                    <option>USD</option>
                    <option>EUR</option>
                    <option>CAD</option>
                    <option>ETH</option>
                    <option>BTC</option>
                    <option>SOL</option>
                </select>
            </div>
            <span class="swap" onclick="swapCurr()">&#x2194;</span>
            <div class="to-group">
                <input id="to-amount" class="amount-output" type="text" disabled>
                <select id="to-curr">
                    <option>CZK</option>
                    <option>USD</option>
                    <option selected>EUR</option>
                    <option>CAD</option>
                    <option>ETH</option>
                    <option>BTC</option>
                    <option>SOL</option>
                </select>
            </div>
            <span class="separator">|</span>
            <div id="alternatives" class="alt-group"></div>
        </div>
    </div>
    <script src="currency-converter-extension/shared/history.js"></script>
    <script src="currency-converter-extension/shared/converter.js"></script>
</body>
</html>
